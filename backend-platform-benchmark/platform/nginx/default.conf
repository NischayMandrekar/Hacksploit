# Nginx is the only published application entry point in the default Compose stack.
limit_req_zone $binary_remote_addr zone=general_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_api:10m rate=10r/m;

upstream fastapi_upstream {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;
    error_page 429 = @rate_limited;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location @rate_limited {
        default_type application/json;
        return 429 '{"error":{"code":"rate_limit_exceeded","message":"Too many requests.","request_id":"$request_id"}}';
    }

    location = /health {
        proxy_pass http://fastapi_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location = /ready {
        proxy_pass http://fastapi_upstream/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location ~ ^/api/v1/auth/(register|login|refresh|change-password|logout|logout-all)$ {
        limit_req zone=auth_api burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://fastapi_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 3s;
        proxy_send_timeout 15s;
        proxy_read_timeout 30s;
    }

    location / {
        limit_req zone=general_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://fastapi_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }
}
