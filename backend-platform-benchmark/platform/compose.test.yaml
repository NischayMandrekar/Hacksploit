name: local-backend-platform-tests
services:
  test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: platform_test
      POSTGRES_USER: platform_test
      POSTGRES_PASSWORD: disposable_test_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_test -d platform_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate-test:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://platform_test:disposable_test_only@test-db:5432/platform_test
    depends_on:
      test-db:
        condition: service_healthy

  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://platform_test:disposable_test_only@test-db:5432/platform_test
      DATABASE_URL: postgresql+psycopg://platform_test:disposable_test_only@test-db:5432/platform_test
      APP_MASTER_KEY: integration-test-master-key-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      PROMETHEUS_ENABLED: "false"
    depends_on:
      test-db:
        condition: service_healthy
      migrate-test:
        condition: service_completed_successfully
