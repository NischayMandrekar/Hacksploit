[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "local-backend-platform"
version = "0.1.0"
description = "A compact, durable, local-first job platform with an independently runnable worker."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.13,<2.0",
  "prometheus-client>=0.21,<1.0",
  "PyJWT>=2.9,<3.0",
  "argon2-cffi>=23.1,<26.0",
]

[project.optional-dependencies]
rabbitmq = ["pika>=1.3,<2.0"]
redis = ["redis>=5.0,<7.0"]
kafka = ["kafka-python-ng>=2.2,<3.0"]
test = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0"]
all = ["pika>=1.3,<2.0", "redis>=5.0,<7.0", "kafka-python-ng>=2.2,<3.0", "pytest>=8.0,<9.0", "httpx>=0.27,<1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/platform_app"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
