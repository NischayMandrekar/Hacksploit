services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: backend_lab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: local_dev_only

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d backend_lab"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data: